name: mindforge
description: "Offline brain-training games. No network, no accounts, no telemetry."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # A real range, never an exact pin — dependency-hygiene rule 4. The tool
  # version this was built against lives in .toolchain.json.
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
# Every direct dependency below is named in test/policy/dependency_policy_test.dart's
# reviewed allow-set with the epic that first uses it. Adding one without editing
# that list is a red test, not a silent `pub get`.
dependencies:
  clock: ^1.1.2
  # PINNED: drift_dev 2.34.0's schema tooling does not compile against drift
  # 2.34.1+ — verifier_common.dart references GeneratedDatabase.allSchemaEntities
  # and .schema, which drift's drift3_preview changed. Measured 2026-08-19:
  # `dart run drift_dev schema dump` fails to build on drift 2.34.2 and 2.34.3
  # and succeeds on 2.34.0.
  #
  # The obvious fix — upgrade drift_dev to 2.34.5 — is blocked from the other
  # side: drift_dev >= 2.34.1+1 needs analyzer ^13, while riverpod 3.4.2's
  # regular dependency on package:test drags in analyzer >=8 <13. CLAUDE.md
  # mandates Riverpod 3.x, so the graph cannot be resolved that way.
  #
  # Revisit when riverpod drops its package:test dependency, or when drift_dev
  # supports analyzer 12. Then this becomes a caret range again.
  drift: '>=2.34.0 <2.34.1'
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.5.0
  intl: ^0.20.2
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.1
  uuid: ^4.6.0


dev_dependencies:
  build_runner: ^2.15.1
  # Test-only, for test/policy/reference_manifest_test.dart: it recomputes the
  # sha256 hashes capture-screens.sh wrote, which is how CI notices that a
  # reference screenshot no longer matches the app.html it was rendered from.
  # Already in the lock as a transitive dependency at 3.0.7; declared here
  # because depend_on_referenced_packages is right that an import must be
  # declared.
  crypto: ^3.0.7
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runs gen-l10n against l10n.yaml as part of `flutter pub get` and the build.
  generate: true

  # Fonts are BUNDLED, never fetched (CLAUDE.md). google_fonts is banned
  # because it ships an HTTP code path into an app whose central promise is
  # that it has none.
  #
  # Both families ship upstream as VARIABLE fonts, so each is declared once
  # with no per-weight `asset:` entries and no `weight:` key. Weight is driven
  # by FontWeight against the wght axis; a redundant FontVariation('wght', ...)
  # on top of that is what design-system-structure rule 10 forbids.
  #
  # Three faces, four locales. Fredoka and Nunito have NO Arabic-script
  # coverage, so fa and ckb are served entirely by Vazirmatn — display and body
  # both. Every step's fontFamilyFallback ends in a face that can draw the
  # script it is rendering; a glyph falling through to an OS font is a defect,
  # not a graceful fallback, and it is invisible on a developer's device.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka[wdth,wght].ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito[wght].ttf
    # Arabic script, for fa and ckb. ONE family in both roles: Lalezar was
    # measured against its own cmap and is missing five of the seven Sorani
    # letters, so it is refused. See sunburst_type.dart.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn[wght].ttf

  # The OFL texts are declared as assets so registerSunburstFontLicences() can
  # read them at runtime. Two files, not one: Fredoka and Nunito carry
  # different copyright holders and a single OFL.txt would misattribute one.
  assets:
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-Vazirmatn.txt
