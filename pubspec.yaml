name: mindforge
description: "Offline brain-training games. No network, no accounts, no telemetry."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # A real range, never an exact pin — dependency-hygiene rule 4. The tool
  # version this was built against lives in .toolchain.json.
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
# Every direct dependency below is named in test/policy/dependency_policy_test.dart's
# reviewed allow-set with the epic that first uses it. Adding one without editing
# that list is a red test, not a silent `pub get`.
dependencies:
  clock: ^1.1.2
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.5.0
  intl: ^0.20.2
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.1
  uuid: ^4.6.0


dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  test: ^1.31.0
  very_good_analysis: ^10.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runs gen-l10n against l10n.yaml as part of `flutter pub get` and the build.
  generate: true

  # Fonts are BUNDLED, never fetched (CLAUDE.md). google_fonts is banned
  # because it ships an HTTP code path into an app whose central promise is
  # that it has none.
  #
  # Both families ship upstream as VARIABLE fonts, so each is declared once
  # with no per-weight `asset:` entries and no `weight:` key. Weight is driven
  # by FontWeight against the wght axis; a redundant FontVariation('wght', ...)
  # on top of that is what design-system-structure rule 10 forbids.
  #
  # LATIN COVERAGE ONLY. Fredoka and Nunito have no Arabic script, so `fa` and
  # `ckb` would tofu today. E03 T03.7 is the only other place this block may be
  # edited: it adds Vazirmatn for body plus one Arabic-script display face, and
  # extends kExpectedFontFamilies in test/policy/font_declaration_test.dart.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka[wdth,wght].ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito[wght].ttf

  # The OFL texts are declared as assets so registerSunburstFontLicences() can
  # read them at runtime. Two files, not one: Fredoka and Nunito carry
  # different copyright holders and a single OFL.txt would misattribute one.
  assets:
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Nunito.txt
