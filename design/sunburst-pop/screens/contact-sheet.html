<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sunburst Pop — screen reference sheet</title>
<style>
  :root{--cream:#FFF8EC;--ink:#2B1B4D;--paper:#fff}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--cream);
       font:600 13px/1.4 "Nunito","Avenir Next",system-ui,sans-serif;color:var(--ink)}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:0 0 20px;font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  figure{margin:0}
  img{width:100%;height:auto;display:block;border:3px solid var(--ink);
      border-radius:14px;box-shadow:5px 5px 0 var(--ink);background:var(--paper)}
  figcaption{margin-top:10px;text-align:center}
</style></head><body>
<h1>Sunburst Pop — reference screens</h1>
<p>Rendered from design/sunburst-pop/app.html at 390&times;844. These are the implementation targets.</p>
<div class="grid">
  <figure><img src="01-home.png" alt="home screen"><figcaption>01-home</figcaption></figure>
  <figure><img src="02-game-detail.png" alt="game-detail screen"><figcaption>02-game-detail</figcaption></figure>
  <figure><img src="03-countdown.png" alt="countdown screen"><figcaption>03-countdown</figcaption></figure>
  <figure><img src="04-stroop-rush.png" alt="stroop-rush screen"><figcaption>04-stroop-rush</figcaption></figure>
  <figure><img src="05-schulte-grid.png" alt="schulte-grid screen"><figcaption>05-schulte-grid</figcaption></figure>
  <figure><img src="06-results.png" alt="results screen"><figcaption>06-results</figcaption></figure>
  <figure><img src="07-stats.png" alt="stats screen"><figcaption>07-stats</figcaption></figure>
  <figure><img src="08-settings.png" alt="settings screen"><figcaption>08-settings</figcaption></figure>
</div></body></html>
