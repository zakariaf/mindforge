# Builder configuration.
#
# Every builder is fenced with a `generate_for:` glob. Without one, editing any
# file in the package makes build_runner reconsider the whole tree, and a
# generator that scans lib/ finds nothing to do far more often than it finds
# something (codegen-and-toolchain rule 2).
targets:
  $default:
    builders:
      drift_dev:
        # lib/data/ is the only directory allowed to hold a drift symbol
        # (persistence-drift; check-drift-confinement.sh enforces it).
        generate_for:
          - lib/data/**
        # No `options:` block. Two were briefly set here with a comment that
        # described them as an output-layout choice; they are not.
        # `store_date_time_values_as_text` is a PERMANENT storage-format
        # decision — flipping it later silently reinterprets every stored
        # timestamp — and MindForge declares no DateTime column at all, storing
        # UTC epoch milliseconds as plain integers, so the option would govern
        # nothing while looking like a reviewed choice. Add an option here only
        # with a comment saying what it actually changes.
