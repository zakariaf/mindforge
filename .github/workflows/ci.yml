# MindForge CI.
#
# Runs on macOS because iOS is the only shipping target. A Linux job would be
# cheaper and would prove something about a platform nobody ships.
#
# ---------------------------------------------------------------------------
# WHAT THIS PIPELINE CANNOT PROVE. Stated here rather than left implied, so
# nobody reads a green check as more than it is:
#
#   * that the app launches at all. The canonical simulator, MindForge
#     iPhone 14 (390x844), is a machine-local device; no GitHub runner has it.
#     build-ios proves the tree COMPILES for the shipping platform. The launch
#     proof is a local artifact: docs/verification/e01-simulator-launch.png.
#   * screenshot parity against design/sunburst-pop/screens/. That is a human
#     placing two images side by side. Every screen task carries an explicit
#     comparison step, and the PR body must name which screens were compared.
#   * font rendering, and Arabic-script shaping in fa and ckb.
#   * RTL rendering. A goldens diff can prove shaping CHANGED; it cannot prove
#     the shaping is correct, and it proves nothing about translation quality.
#   * motion, press physics and haptics. A simulator reproduces no haptics at
#     all; those are judged on a physical device in E11's sweep.
#   * translation quality. E11 gates release on a native Persian and a native
#     Sorani reader walking all eight screens.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push should stop burning macOS minutes, which GitHub bills at a
# multiple of Linux minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # VERIFY: confirm macos-15 is a current GitHub-hosted image label before merge.
    # Never macos-latest: image drift moves Xcode and the toolchain with no diff
    # to review (ci-pipeline-and-gates rule 2).
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        # VERIFY: confirm v4 is still the current major.
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned literally, and test/policy/ci_workflow_test.dart asserts this
          # equals .toolchain.json's flutter key. .fvmrc is deliberately not
          # used, so flutter-version-file cannot point at the record; the drift
          # is caught by a test instead of by the action.
          flutter-version: '3.44.6'
          cache: true

      - name: Record the host tools
        # Not a gate — a log line, so a failure caused by an image bump is
        # diagnosable from the run alone.
        run: |
          sw_vers
          bash --version | head -1
          xcodebuild -version
          pod --version || echo "cocoapods not on this image"

      - name: Provide bash 5
        # tool/skill_gates.sh needs bash 4+ because one skill script uses
        # mapfile. macOS ships bash 3.2, and so does this runner image — moving
        # CI to macOS means the runner no longer supplies bash 5 for free the
        # way the Ubuntu image did.
        # VERIFY: check whether the image's default bash is already 4+, and drop
        # this step if so.
        run: |
          brew install bash
          echo "BASH5=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
          "$(brew --prefix)/bin/bash" --version | head -1

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check the toolchain
        # The runner's Flutter MUST equal .toolchain.json — that is the version
        # which re-renders goldens and perturbs seeded determinism. Its Xcode
        # and CocoaPods are logged as WARN instead: the image's Xcode is not
        # ours to pin to 26.6, and failing on a fact we do not control is not a
        # gate.
        run: TOOLCHAIN_HOST_TOOLS=warn bash tool/check_toolchain.sh

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check generated code is committed and fresh
        # The decision is that generated code is COMMITTED, and a
        # committed-generated-code policy without its freshness gate is not a
        # policy. No build_runner generator is wired yet, so that half passes
        # trivially today; the gen-l10n half is live from E01.
        #
        # `git status --porcelain`, not `git diff`: git diff compares TRACKED
        # files only, so a newly CREATED generated file is invisible to it.
        # That is not hypothetical — when E04 adds app_de.arb, gen-l10n emits a
        # new lib/l10n/app_localizations_de.dart, and forgetting to commit it
        # would leave a diff-based gate green over an incomplete generated set.
        run: |
          changed=$(git status --porcelain -- \
            '*.g.dart' '*.freezed.dart' '*.drift.dart' \
            'lib/l10n/app_localizations*.dart')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Generated output is stale or uncommitted. Run 'flutter gen-l10n' and 'dart run build_runner build', then commit the result."
            exit 1
          fi

      - name: Check the RTL design strings are current
        # The Persian reference screenshots read their strings from this file,
        # which is generated from lib/l10n/app_fa.arb. Editing an ARB without
        # re-dumping would leave the reference and the app disagreeing — and
        # the reference is what every RTL screen is built against.
        #
        # The dump WRITES, so it is tagged `tool` and excluded from the default
        # test lane: a gate that regenerates what it checks asserts nothing.
        # Here it is run first and then diffed, which is the same
        # generate-then-diff shape as the codegen gate above.
        run: |
          flutter test --tags tool tool/dump_design_strings_test.dart
          changed=$(git status --porcelain -- design/sunburst-pop/rtl/strings-fa.json)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::design/sunburst-pop/rtl/strings-fa.json is stale. Run 'flutter test --tags tool tool/dump_design_strings_test.dart' and commit the result."
            exit 1
          fi

      - name: Check the reference screenshots match their sources
        # The manifest capture-screens.sh wrote records the sha256 of app.html,
        # of strings-fa.json, and of every PNG. CI has no Chrome and cannot
        # re-render, but it can recompute hashes — which is exactly enough to
        # catch a source edited without a re-capture.
        #
        # Not hypothetical: app.html once carried data-num="640" while the
        # committed 06-results.png still showed a Latin 640, with every gate
        # green and only a human opening the PNG noticing.
        run: flutter test test/policy/reference_manifest_test.dart

      - name: Check the schema snapshots are current
        # The committed v1 snapshot must match the live schema, or the
        # migration harness in test/data/migration/ verifies against a stale
        # record and proves nothing.
        #
        # The output path must be a FILE, not the directory: measured on
        # drift_dev 2.34.0, the directory form fails with "the schema version
        # could not be read from the database class".
        run: |
          dart run drift_dev schema dump lib/data/db/app_database.dart \
            drift_schemas/drift_schema_v1.json
          changed=$(git status --porcelain -- drift_schemas/)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::The schema snapshot is stale. Re-run the dump above and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        # Two tags are excluded here and each has its own step:
        #   tool    WRITES a tracked file, and is run above where its output is
        #           diffed. A gate that regenerates what it checks asserts
        #           nothing.
        #   golden  compares pixels, needs the real bundled faces, and belongs
        #           in a lane that can be read on its own when it fails.
        #
        #
        # ONE --exclude-tags with a boolean selector, not two flags.
        # flutter_tools declares it as a single addOption, so repeating it
        # LAST-WINS and silently drops the first. Measured: `--exclude-tags
        # golden --exclude-tags tool` ran all six golden tests.
        run: |
          flutter test --test-randomize-ordering-seed random \
            --exclude-tags "tool || golden" --reporter expanded

      - name: Golden lane
        # COMPARE ONLY. There is deliberately no --update-goldens step anywhere
        # in this repository: re-blessing a golden is a local, reviewed act in a
        # commit that says so, because a pipeline that can bless its own output
        # cannot fail.
        #
        # Six PNGs under test/goldens/rtl/. They detect a CHANGE in shaping,
        # mirroring or digit block. They do not prove the shaping is correct and
        # they prove nothing about translation — that is the human comparison
        # against design/sunburst-pop/screens/rtl/ and E11's native-speaker
        # review.
        run: flutter test --tags golden --reporter expanded

      # A FAILED GOLDEN IS AN IMAGE, and reading it is how you tell a real
      # regression from a rendering difference between this runner and the
      # machine that blessed it. Without this the log names the tests and
      # nothing else, and the only way to see a diff is to guess at it.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: '**/failures/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Run the skill gates
        # A block scalar, because `run: "$BASH5" tool/...` is NOT valid YAML —
        # content after a closing quote is a parse error, and GitHub rejects the
        # whole file before any job starts. Every run on every branch had been
        # failing in 0s with "this run likely failed because of a workflow file
        # issue", which reads like infrastructure rather than a bug in the file.
        run: |
          "$BASH5" tool/skill_gates.sh

      - name: Check the engine is locale-independent
        # Named separately so a failure names itself in the job log rather than
        # being one line inside a thousand-test run.
        #
        # THE CONTRACT: seeded generation and every persisted value are
        # locale-independent, and localisation happens at render. A generator
        # seeded off a formatted string, a Jalali date in the runs table, or an
        # Eastern Arabic numeral in a column a personal-best query compares with
        # MAX() would all compile and all pass an English-only suite.
        #
        # HONEST LIMIT: these tests exercise intl formatting and the engine's
        # own values. They do not pump a MaterialApp, so a green run here is NOT
        # evidence that the app can switch to Kurdish Sorani — that is E04's
        # vendored delegate trio and E04's test.
        run: |
          flutter test \
            test/engine/locale_independence_test.dart \
            test/policy/engine_locale_purity_test.dart \
            --reporter expanded

      - name: Check the shell and game seam
        # The claim this whole engine exists to defend: a second game ships
        # without editing lib/features. Asserted from both sides — the shell
        # imports no specific game, and no game builds shell chrome.
        run: |
          .claude/skills/sunburst-shell-screens/scripts/check_shell_boundaries.sh lib
          .claude/skills/seeded-determinism-and-golden-vectors/scripts/check-determinism-bans.sh lib/core

      - name: Check the motion and haptic contracts
        # Named separately as well as inside the runner, for the same reason the
        # directional-geometry gate is: a reviewer needs to see WHICH contract
        # broke without opening a log.
        #
        # WHAT THIS PIPELINE CANNOT PROVE, stated here rather than assumed:
        #
        #   * NO HAPTIC IS REAL IN CI OR IN A SIMULATOR. The iOS Simulator has
        #     no Taptic Engine. The fake gateway proves call COUNT and ordering
        #     and nothing about intensity, about a burst that reads as a rattle,
        #     or about iOS's Taptic Engine being asleep right after
        #     foregrounding. Those are physical-iPhone checks and belong to
        #     E11's design-review sweep, graded BLOCKER.
        #   * NO AUDIO EXISTS AT ALL. Nine named slots, no assets, no player.
        #     Every sound assertion in this repository is about which NAME a
        #     moment maps to.
        #   * NOTHING HERE IS VERIFIED ON ANDROID. Android is deferred; this
        #     workflow builds and tests for iOS only, and no gate in it implies
        #     parity.
        #   * TRANSLATION QUALITY IS NOT A GATE. The fa and de goldens prove
        #     that Arabic-script and long German labels render and fit. They say
        #     nothing about whether the words are right — that is E04's open
        #     item and E11's native-speaker sign-off.
        run: .claude/skills/sunburst-motion-and-haptics/scripts/check_motion_tokens.sh lib

      - name: Check directional geometry
        # Named separately as well as inside the runner, because this is the one
        # gate whose failure a reviewer needs to see BY NAME in the checks list.
        # The contract: geometry stays Directional, so E04's RTL work is a
        # string job rather than a layout rewrite across a built catalog.
        run: .claude/skills/i18n-rtl-l10n/scripts/check_i18n_bans.sh lib

  build-ios:
    # VERIFY: same label question as above.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build for iOS without signing
        # One named contract: THE TREE COMPILES FOR THE SHIPPING PLATFORM, not
        # merely analyzes. A sealed-switch exhaustiveness failure is a compile
        # error and not a lint, so an analyze-only pipeline goes green over code
        # that will not build (lint-and-style-config rule 7).
        # --no-codesign is what makes this runnable with no signing identity in
        # the repository; signing belongs to E11.
        run: flutter build ios --no-codesign
